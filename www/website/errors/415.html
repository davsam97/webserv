<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>415 Unsupported Media Type</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .panel {
      width: 100%;
      max-width: 520px;
      padding: 2rem;
      background: var(--panel);
      border-top: 4px solid var(--accent);
      border-radius: 8px;
    }
    .brand { color: var(--muted); font-size: 0.85rem; }
    .code {
      margin: 0.5rem 0 0;
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }
    .reason { margin: 0.5rem 0; font-size: 1.5rem; }
    .desc { color: var(--muted); line-height: 1.6; }
    .rule { border: 0; border-top: 1px solid var(--bg); margin: 1.5rem 0 1rem; }
    .foot {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">webserv &middot; <b>HTTP/1.0</b> server</div>
    <p class="code">415</p>
    <h1 class="reason">Unsupported Media Type</h1>
    <p class="desc">The server does not support the media type of the request body.</p>
    <hr class="rule">
    <div class="foot">
      <span><a href="/">&larr; Back to index</a></span>
      <span>415 Unsupported Media Type</span>
    </div>
  </main>
</body>
</html>
