# Default configuration: two virtual hosts (127.0.0.1:8080 and :8081),
# static files, CGI, uploads, redirects and custom error pages.
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root www/website;
    index index.html;
    client_max_body_size 40000;          # ~40 KB — send a bigger body to get a 413
    autoindex off;
    error_page 400 /errors/400.html;
    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 408 /errors/408.html;
    error_page 409 /errors/409.html;
    error_page 411 /errors/411.html;
    error_page 413 /errors/413.html;
    error_page 414 /errors/414.html;
    error_page 415 /errors/415.html;
    error_page 431 /errors/431.html;
    error_page 500 /errors/500.html;
    error_page 501 /errors/501.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;
    error_page 505 /errors/505.html;

    location / {
        methods GET;
    }

    location /cgi-bin {
        root www/website/cgi-bin;
        methods GET POST;
        autoindex on;
        cgi .py;
        cgi .sh;
        cgi .bin;
        cgi .php invalid_interpreter;
    }

    location /errors {
        root www/website/errors;
        methods GET;
        index new_index.html;
    }
    
    location /google {
        methods GET;
        return 302 https://www.google.com/;
    }

    location /hidden.html {
        methods GET;
        return 301 /public.html;
    }

    location /public.html {
        methods GET POST;
    }
    
    location /uploads {
        root www/website/uploads;
        methods GET POST DELETE;
        upload_dir www/website/uploads;
        autoindex on;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name localhost2;

    root www/website2;

    location / {
        methods GET POST;
    }
}
